
name: CI-CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Normalize Docker username
        id: docker_username
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          username="$(printf '%s' "$DOCKER_USERNAME" | tr -d '\r\n' | xargs)"
          if [ -z "$username" ]; then
            echo "DOCKER_USERNAME secret is empty"
            exit 1
          fi
          echo "value=$username" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ steps.docker_username.outputs.value }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.docker_username.outputs.value }}/frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.docker_username.outputs.value }}/backend:latest

      - name: Prepare EC2 deployment directory
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: mkdir -p /home/ubuntu/app

      - name: Copy deployment configuration to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "/home/ubuntu/app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        env:
          DOCKER_USERNAME: ${{ steps.docker_username.outputs.value }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          envs: DOCKER_USERNAME,DOCKER_PASSWORD
          script: |
            set -eu
            cd /home/ubuntu/app

            sed -i "s|YOUR_DOCKERHUB_USERNAME|$DOCKER_USERNAME|g" docker-compose.yml

            printf '%s' "$DOCKER_PASSWORD" |
              docker login -u "$DOCKER_USERNAME" --password-stdin

            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
