name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Normalize Docker username
        id: docker_username
        run: |
          docker_username="$(echo "${{ secrets.DOCKER_USERNAME }}" | tr -d '\r\n' | xargs)"
          if [ -z "$docker_username" ]; then
            echo "DOCKER_USERNAME secret is empty"
            exit 1
          fi
          echo "::add-mask::$docker_username"
          echo "value=$docker_username" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.docker_username.outputs.value }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.docker_username.outputs.value }}/frontend:latest

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.docker_username.outputs.value }}/backend:latest

      - name: Copy docker-compose and nginx config to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          source: "docker-compose.yml,nginx/default.conf"
          target: "/home/ubuntu/app"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USERNAME }}
          key: ${{ secrets.AWS_PRIVATE_KEY }}
          script: |
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
            sed -i "s|YOUR_DOCKERHUB_USERNAME|${{ steps.docker_username.outputs.value }}|g" docker-compose.yml
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ steps.docker_username.outputs.value }}" --password-stdin
            docker pull ${{ steps.docker_username.outputs.value }}/frontend:latest
            docker pull ${{ steps.docker_username.outputs.value }}/backend:latest
            docker compose down
            docker compose up -d
            docker image prune -f
